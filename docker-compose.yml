version: '3.8'

services:
  # Node.js приложение (Telegram бот + API)
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: neiropsy_bot
    ports:
      - "8088:8088"
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - DATABASE_URL=postgres://neiropsy:neiropsy_password@db:5432/neiropsy_db
      # Redis опционален - если не указан, используется in-memory хранилище
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PORT=8088
    depends_on:
      db:
        condition: service_healthy
      # Redis опционален - приложение может работать без него (in-memory хранилище)
      # redis:
      #   condition: service_healthy
    restart: unless-stopped
    # volumes:
    #   - ./app:/app
    #   - /app/node_modules
    networks:
      - neiropsy_network

  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: neiropsy_db
    environment:
      POSTGRES_DB: neiropsy_db
      POSTGRES_USER: neiropsy
      POSTGRES_PASSWORD: neiropsy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  # Изменен внешний порт на 5433 чтобы не конфликтовать с uk-postgres-dev
    restart: unless-stopped
    networks:
      - neiropsy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neiropsy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для хранения состояний сессий
  redis:
    image: redis:7-alpine
    container_name: neiropsy_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Изменен внешний порт на 6380 чтобы не конфликтовать с uk-redis-dev
    restart: unless-stopped
    networks:
      - neiropsy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  neiropsy_network:
    driver: bridge

