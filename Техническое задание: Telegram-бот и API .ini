Техническое задание: Telegram-бот и API для батч-опросов
1. Общая цель системы

Данный проект представляет собой монолитный сервис на Node.js (TypeScript), который объединяет Telegram-бот и REST API для проведения психологических опросов в батчевом формате. Основная цель системы – упростить специалистам (администраторам) процесс массового скрининга: они смогут сформировать батч из нескольких опросников и предоставить клиенту (например, родителю) одну ссылку на бот. Клиент пройдёт последовательно все опросники через интерфейс бота, после чего система автоматически агрегирует результаты и предоставляет специалисту сводный отчет. Таким образом, система экономит время специалистов и обеспечивает удобство для клиентов, позволяя им заполнить несколько анкет за один сеанс общения с ботом.

Ключевые особенности и задачи системы:

Единый процесс для нескольких опросников: Специалист собирает пакет опросников (2–10 штук) и получает уникальную ссылку. Клиент, перейдя по ссылке, последовательно отвечает на все вопросы из всех опросников, как если бы это был один длинный опрос.

Автоматическое агрегирование результатов: После прохождения всех опросников бот суммирует и анализирует результаты (баллы, риски, флаги) по каждому опроснику и в целом, формируя итоговый агрегированный отчет.

Удобное получение отчета: Специалист оперативно получает уведомление в Telegram о завершении батча и может просмотреть итоговый отчет прямо в чате бота либо выгрузить результаты в формате JSON/CSV для дальнейшего использования.

Русскоязычный интерфейс через кнопки: Весь пользовательский интерфейс бота – на русском языке. Все действия выполняются через нажатие кнопок (inline-keyboard или клавиатура бота). Специалист и клиент не вводят команды вручную, за исключением служебной команды /start при переходе по ссылке (вызывается автоматически по клику на ссылку). Это облегчает использование и предотвращает ошибки ввода.

2. Архитектура и основные компоненты

Система реализована как монолитное приложение Node.js, объединяющее логику Telegram-бота и веб-сервиса (API). Все компоненты работают в одном процессе и обращаются к общей базе данных. Это упрощает развертывание и обслуживание по сравнению с распределенной архитектурой. Ниже приведены основные компоненты и модули системы:

TelegramController (модуль бота): Отвечает за интеграцию с Telegram. Использует бот API (например, через библиотеку Telegraf или node-telegram-bot-api) для получения обновлений и отправки сообщений. Обрабатывает нажатия кнопок и команды от пользователей. Для администратора обрабатывает создание батча, для клиента – прохождение опросов. Этот модуль переводит события Telegram в вызовы бизнес-логики (BatchService) и формирует ответы (тексты, кнопки) для пользователя.

RestController (модуль API): Реализует REST API эндпойнты для управления батчами и получения отчетов. Построен на простом веб-фреймворке (предпочтительно Express, как хорошо известном и простом в обслуживании). Предоставляет HTTP-интерфейс для тех же операций, что доступны через бота: создание батча, запуск сессии, проверка статуса, получение результатов и экспорт. В текущей версии API может использоваться для интеграции с внешними системами или админ-панелью. Аутентификация запросов на API пока отсутствует (MVP), поэтому желательно разворачивать его во внутренней сети или ограничивать доступ (в будущем планируется JWT или API-ключи).

BatchService (бизнес-логика батчей): Основной сервис, инкапсулирующий всю бизнес-логику работы батч-опросов. Он предоставляет методы для:

Создания нового батча (группы опросников) – создание записей в базе (questionnaire_batches и связанные таблицы).

Генерации сессии прохождения (токена) для конкретного батча – создание записи batch_sessions с уникальным токеном и сроком действия.

Управления прогрессом прохождения опросов клиентом – хранение текущего состояния, последовательный переход по опросникам, сохранение ответов. Здесь реализована своего рода конвейерная FSM-логика (finite state machine) для батч-сессии (см. раздел 4).

Завершения сессии и запуска генерации отчета – после получения всех ответов BatchService агрегирует результаты (считает баллы, определяет категории риска, выводы) и сохраняет отчет в batch_reports.

Уведомления администратора – после генерации отчета сервис вызывает метод отправки уведомления через TelegramController, чтобы информировать специалиста о готовности результатов.

Database (база данных): Реляционная база данных (например, PostgreSQL) хранит данные опросников, батчей, сессий и результатов. Используется предложенная схема данных (см. раздел 3) с дополнительными таблицами для батч-опросов. Доступ к БД осуществляется либо напрямую через драйвер/ORM (например, Prisma, TypeORM) из BatchService, либо через слой Repository/DAO. Все операции (создание батча, запись ответов, генерация отчета) выполняются транзакционно, чтобы обеспечить целостность данных.

State Storage (хранение состояния сессии): Для отслеживания текущего прогресса клиента по вопросам (какой опросник и вопрос сейчас, какие ответы даны) система использует хранилище состояний. В простейшем случае можно хранить состояние в памяти процесса (например, в структуре Map в BatchService, по ключу user_id или chat_id). Однако для надежности и масштабируемости допускается использование Redis как внешнего хранилища состояний (опционально). Redis позволит сохранять состояние между перезапусками сервиса и поддерживать несколько экземпляров приложения (чтобы ответы, полученные на одном инстансе, были видны другому при продолжении сессии). Если Redis не настроен, система будет работать с состоянием в памяти – при падении процесса текущий незавершенный опрос придется начать заново. В рамках MVP это приемлемо, но рекомендуется использовать Redis при развёртывании в продакшене для повышения надежности.

Компоненты отчётности: Генерация отчетов выполняется внутри BatchService (может быть выделена как вспомогательный модуль ReportGenerator). Он формирует текстовые выводы и структурированные данные на основе всех собранных ответов. Также отвечает за формирование экспортных файлов (JSON, CSV) при запросе. Логика генерации включает правила интерпретации результатов каждого опросника (использует данные из scoring_json каждого опросника в БД) и агрегирует их.

Логирование и мониторинг: В приложении предусмотрено ведение логов основных событий и ошибок. Например, успешное создание батча, ошибки валидации, получение ответа от пользователя, завершение сессии, генерация отчета – всё это записывается в логи. Логи помогают отладке и упрощают поддержку. При необходимости интегрируется мониторинг (например, на базе Prometheus) для отслеживания метрик производительности (время ответа на запросы, количество активных сессий и т.д.).

Монолитная реализация: Все вышеописанные модули запускаются в одном Node.js приложении. Это означает, что TelegramController и RestController – просто разные части одного кода, они могут обращаться к общим функциям BatchService и общему хранилищу. Например, при создании батча через API или через бота вызывается один и тот же метод BatchService.createBatch(...). Такой подход упрощает разработку (нет межсервисного взаимодействия) и соответствует требованиям (вся логика в одном сервисе).

Примечание об администраторе: В системе предусмотрен единственный администратор/специалист, который имеет права создавать батчи и получать отчеты. Его Telegram ID захардкожен (либо задается через переменные окружения). TelegramController проверяет chat_id отправителя: только если он совпадает с ID администратора, разрешаются команды/кнопки для управления батчами. Остальные пользователи (клиенты) смогут лишь проходить опросы по ссылке, но не создавать новые батчи. Это простой способ ограничения доступа без реализации полноценной системы авторизаций.

3. Структура базы данных

Для хранения информации используется реляционная база данных. Существуют уже готовые таблицы с опросниками и индивидуальными ответами, и добавляются новые таблицы для поддержки батч-опросов. Ниже перечислены таблицы и их поля:

questionnaires – существующая таблица с шаблонами опросников (опросные листы):

id (PK) – уникальный идентификатор опросника (UUID).

title – название опросника.

questions_json – JSON с перечнем вопросов данного опросника.

scoring_json – JSON с описанием правил подсчета баллов/результатов для опросника.

Назначение: хранение контента опросников (вопросы, варианты ответов, логика оценки).

responses – существующая таблица индивидуальных результатов прохождения одного опросника:

id (PK) – уникальный идентификатор результата (например, UUID).

session_id (FK) – ID сессии пользователя (если применимо в старой системе; может быть null или ссылаться на таблицу сессий отдельного опроса).

answers_json – JSON с ответами пользователя на вопросы данного опросника.

score_json – JSON с рассчитанными баллами или категориями (например, общий балл, подшкалы, метки риска).

summary_text – текстовое резюме/вывод по результатам этого опросника (может содержать краткое описание результатов для пользователя).

Назначение: хранение детальных результатов отдельного опросника. В контексте батчей, на каждый опросник будет создана одна запись в responses по завершении этого опросника клиентом.

questionnaire_batches – новая таблица батчей опросников:

id (PK) – уникальный идентификатор батча (UUID).

title – название батча, задается специалистом (например, "Комплексное обследование ребенка").

created_by_telegram_id – Telegram ID специалиста, создавшего батч.

is_active – флаг активности (boolean), указывает, можно ли создавать новые сессии по этому батчу. Предполагается, что батч можно деактивировать, чтобы по нему нельзя было выдать новые ссылки (например, после использования).

Назначение: хранение информации о группе опросников. Батч объединяет несколько опросников под одним ID и названием. Один специалист может иметь несколько батчей (например, разные наборы опросников для разных случаев).

batch_questionnaires – новая вспомогательная (связующая) таблица для связи батча и опросников:

id (PK) – уникальный ID (может быть автоинкремент).

batch_id (FK) – ссылка на questionnaire_batches.id (батч, в который входит опросник).

questionnaire_id (FK) – ссылка на questionnaires.id (какой опросник включен).

order_index – порядок данного опросника в батче (целое число 1,2,3..., определяет последовательность прохождения).

Назначение: хранение состава батча. Каждый батч содержит 2–10 записей в этой таблице – упорядоченный список опросников.

batch_sessions – новая таблица сессий (сеансов прохождения) батча:

id (PK) – уникальный идентификатор сессии (UUID).

batch_id (FK) – ссылка на questionnaire_batches.id, указывает какой батч проходит клиент.

token – уникальный токен (строка) для запуска сессии через Telegram (формируется в формате batch_<random>). Этот токен используется в ссылке бота, чтобы связать пользователя с конкретной сессией батча.

expires_at – дата/время истечения срока действия токена. После этой метки времени попытка начать или продолжить сессию должна быть отклонена (например, бот сообщит, что ссылка просрочена). По умолчанию срок действия – 48 часов, если не указано иное.

completed – флаг завершенности (boolean). Изначально false, устанавливается в true автоматически, когда пользователь прошел все опросники батча до конца.

completed_at – временная метка, когда сессия была завершена (когда получен последний ответ последнего опросника и сгенерирован отчет).

Назначение: отслеживание конкретного прохождения батча конкретным пользователем. Каждая сессия привязана к батчу и имеет свой токен-ссылку. На один батч может быть создано несколько независимых сессий (например, несколько клиентов могут проходить один и тот же набор опросников, каждый по своей ссылке). Таблица также используется для мониторинга прогресса и проверки валидности ссылки.

batch_responses – новая таблица связей между батч-сессией и индивидуальными результатами responses:

id (PK) – уникальный идентификатор записи.

batch_session_id (FK) – ссылка на batch_sessions.id (к какой сессии относятся ответы).

questionnaire_id (FK) – ссылка на questionnaires.id (какой опросник из батча).

response_id (FK) – ссылка на запись в responses.id, содержащую ответы на этот опросник.

order_index – порядковый номер опросника в батче (дублирует информацию из batch_questionnaires, для удобства или целостности).

Назначение: хранение ссылок на результаты каждого опросника внутри сессии. По мере того, как пользователь завершает каждый опросник, приложение сохраняет ответы в responses, а затем создает запись в batch_responses, указывающую какой response соответствует какому опроснику батча. Это позволяет затем собрать все ответы данного клиента по всем опросникам батча.

batch_reports – новая таблица агрегированных отчетов по батч-сессиям:

id (PK) – уникальный идентификатор отчета.

batch_session_id (FK) – ссылка на batch_sessions.id, для какой сессии подготовлен отчет.

summary_text – текстовое резюме результатов батча (агрегированный отчет для человека). Сформировано автоматически на основании всех ответов – включает основные выводы, суммарные баллы, рекомендации. Этот текст используется для отправки специалисту в Telegram.

aggregated_scores – JSON с агрегированными количественными показателями по всем опросникам (например, суммарные баллы по каждому опроснику, уровни риска и т.п.).

flags_json – JSON с перечнем флагов/классификаций, выявленных по итогам (например, ["Высокий риск СДВГ", "Умеренные сенсорные проблемы"]).

Назначение: хранение результатов анализа по завершенному батчу. После того, как клиент прошел все опросники, система вычисляет итоговые показатели и сохраняет их здесь. Это используется для выдачи отчета через API и повторного просмотра отчета, если нужно.

Связи между таблицами обеспечивают целостность данных. При создании батча формируются записи в questionnaire_batches и соответствующие batch_questionnaires. При создании сессии – новая запись в batch_sessions с привязкой к батчу. В процессе прохождения по мере завершения каждого опросника создаются responses и batch_responses. Наконец, при завершении – одна запись в batch_reports.

Замечание: Поля с типом JSON (questions_json, scoring_json, answers_json, score_json, aggregated_scores, flags_json) хранят структурированные данные. Это облегчает хранение сложных результатов, но требует документирования форматов. В рамках данного ТЗ можно считать, что формат этих JSON полей соответствует требованиям существующей системы опросников (например, questions_json содержит список объектов с текстом вопросов и вариантами ответов, а score_json – вычисленные баллы по шкалам).

4. Описание бизнес-логики

Бизнес-логика системы определяет, как создаются батчи, как пользователь проходит опросы, и как формируются результаты. Ключевые аспекты логики:

Используется модель конечного автомата состояний (FSM) для отслеживания состояния каждой батч-сессии.

Реализован алгоритм последовательного проведения опросов: клиент отвечает на вопросы одного опросника за другим.

Реализован алгоритм агрегирования результатов: сбор всех ответов и вычисление итоговых показателей и отчета.

Рассмотрим эти части подробнее.

FSM: Состояния и переходы батч-сессии

Каждая сессия батча (batch_session) имеет жизненный цикл, описываемый следующими основными состояниями:

CREATED (создана): Начальное состояние сразу после создания сессии. Сессия зарегистрирована в базе, сгенерирован токен, но клиент ещё не начал прохождение. В этом состоянии ожидается, что клиент перейдет по выданной ссылке Telegram.

IN_PROGRESS (в процессе): Клиент начал прохождение опросов. Бот отправил приветственное сообщение и сейчас ждет ответов на вопросы. В этом состоянии последовательно задаются вопросы всех опросников батча. Переход в состояние IN_PROGRESS происходит при первом обращении клиента к боту через команду /start batch_token (то есть по клику на ссылку с токеном).

COMPLETED (завершена): Клиент успешно ответил на вопросы всех опросников батча. Это состояние означает, что в базе данных сохранены все индивидуальные ответы (в таблицах responses и batch_responses), и начинается процесс подготовки сводного отчета. Переход в COMPLETED происходит автоматически, как только зафиксирован факт ответов на последний вопрос последнего опросника.

REPORTED (отчет сгенерирован/доставлен): Итоговый отчет сгенерирован и отправлен специалисту. По факту генерации отчета система:

Создает запись в batch_reports с результатами.

Обновляет флаг completed в batch_sessions и проставляет completed_at.

Отправляет уведомление в чат администратора о готовности отчета.

После успешной отправки уведомления состояние считается REPORTED. В принципе, для внешнего пользователя (клиента) состояние COMPLETED и REPORTED уже не отличаются – клиент работу закончил. Для администратора же переход в REPORTED означает, что можно просматривать отчет.

Переходы между состояниями осуществляются следующими событиями:

Начало сессии: Когда пользователь запускает бота по ссылке (с командой /start batch_...), если токен действителен, сессия переходит из CREATED в IN_PROGRESS.

Завершение каждого опросника: остается в состоянии IN_PROGRESS, но внутри этого состояния отслеживается, сколько опросников пройдено. (Реализация: счетчик currentQuestionnaireOrder увеличивается. Если еще остаются опросники, логика продолжает задавать вопросы, иначе…)

Завершение последнего опросника: вызывает переход IN_PROGRESS → COMPLETED.

Генерация отчета и отправка уведомления: практически мгновенно после COMPLETED происходит генерация, отправка отчета и переход → REPORTED.

Диаграмма состояний для наглядности (FSM батч-сессии):

     ┌─────────┐
     │ CREATED │  ← Сессия создана
     └────┬────┘
          │ Клиент перешёл по ссылке
          ▼
    ┌──────────────┐
    │  IN_PROGRESS │  ← Пользователь проходит опросники
    └──────┬───────┘
           │ (опросники 1...N последовательно)
           │ 
           │ Все опросники завершены
           ▼
    ┌──────────────┐
    │  COMPLETED   │  ← Генерация отчёта
    └──────┬───────┘
           │ Отчёт создан
           ▼
    ┌──────────────┐
    │   REPORTED   │  ← Уведомление отправлено администратору
    └──────────────┘


Отмена/прерывание: Если клиент в процессе IN_PROGRESS решает прервать прохождение (нажимает кнопку "Отмена"), бот завершает текущую сессию без генерации отчета. В текущей реализации это может быть оформлено как удаление batch_session или пометка ее неактивной. Однако, для простоты MVP можно не сохранять явно состояние "Cancelled" – достаточно сообщить клиенту об остановке. Администратор по токену сессии увидит, что она не completed и может, при необходимости, инициировать новый батч для клиента.

Истечение срока действия: Если клиент долго не начинал или не закончил опрос (прошло время expires_at), сессия считается протухшей. При попытке воспользоваться просроченным токеном бот откажет (не будет начинать опрос) – можно вывести сообщение "Ссылка недействительна, обратитесь к специалисту". В API для такой ситуации предусмотрен код ошибки 410 (Gone). Просроченную сессию можно считать завершенной неуспешно; администратор при необходимости создаст новую.

Последовательное проведение опросов и обработка ответов

Когда сессия перешла в состояние IN_PROGRESS, начинается последовательный опрос клиента. Система должна выполнить следующие задачи:

Загрузить сценарий опросов: Получить из базы список опросников данного батча (из batch_questionnaires, в нужном порядке) и вопросы первого опросника. Инициализировать состояние прогресса: currentQuestionnaireOrder = 1 (номер текущего опросника), currentQuestionIndex = 0 (номер текущего вопроса в опроснике), пустой буфер для ответов текущего опросника.

Задать вопросы по порядку: Бот отправляет клиенту вопрос за вопросом, ожидая выбор ответа на каждый. Ответы, поступающие от пользователя (нажатия на кнопки с вариантами), обрабатывает TelegramController, который передает их в BatchService.

Сохранение ответа и переход к следующему вопросу: Каждый раз, когда пользователь отвечает, система сохраняет ответ во временное хранилище (в state – либо оперативная память, либо Redis, см. выше) и тут же присылает следующий вопрос. Таким образом, диалог идет в режиме вопрос-ответ.

Внутри BatchService это можно представить так: при получении ответа вызывается функция handleAnswer(user, answer), которая:

сохраняет ответ в текущем состоянии (state.answers[currentQuestionIndex] = answer),

увеличивает currentQuestionIndex на 1,

проверяет, достигнут ли конец вопросов текущего опросника (сравнивает с длиной массива вопросов). Если нет, то ничего больше не делает (бот просто задаст следующий вопрос согласно своему сценарию).

Завершение опросника: Когда currentQuestionIndex становится равен количеству вопросов текущего опросника (т.е. пользователь ответил на последний вопрос):

Сохранить результаты опросника: ответы из state.answers сохраняются как новая запись в таблице responses (например, через функцию saveResponse(state) возвращается объект Response).

Создать запись в batch_responses, связывающую новый response с batch_session и questionnaire (через createBatchResponse(batchSessionId, questionnaireId, response.id, orderIndex)), фиксируя что данный опросник пройден и сохранен.

Очистить временное состояние ответов и увеличить currentQuestionnaireOrder (переходим к следующему опроснику).

Если текущий опросник был последним в батче (т.е. currentQuestionnaireOrder стал больше общего числа опросников totalQuestionnaires), то все опросники пройдены – сессия считается завершенной:

Установить completed = true у сессии, зафиксировать время completed_at (в BatchService метод completeBatchSession).

Перейти к генерации агрегированного отчета (см. ниже) – метод generateBatchReport(batchSessionId) формирует итоговые данные и сохраняет запись в batch_reports.

Отправить уведомление специалисту через бот – метод notifySpecialist(batchSessionId) оформляет и шлет сообщение администратору о завершении батча.

Если опросники ещё остаются (случай, когда не был последний):

Отправить пользователю сообщение о завершении текущего опросника и начать следующий. Бот может сразу представить следующий опросник (например, "✅ Опросник 1 завершен, далее Опросник 2..." – как показано в UX).

В состоянии сохраняются данные для нового опросника: сбросить currentQuestionIndex = 0, очистить буфер ответов state.answers = {} и загрузить вопросы следующего опросника.

Продолжить цикл вопросов-ответов для следующего опросника.

Поддержка перерывов: Если клиент временно перестает отвечать (сделал перерыв), бот напоминает, что прогресс сохраняется. В реализации это означает, что текущее состояние (номер текущего опросника и вопроса, а также уже данные ответы) хранится в памяти/Redis. Когда пользователь вернется (просто напишет боту что-нибудь или нажмет оставшуюся кнопку), бот продолжит с того же места. Если бот перезагружался и состояние не сохранялось, возможно придется начать текущий опросник заново – поэтому для надежности лучше использовать Redis. Тем не менее, пользователь может в любой момент закрыть чат и вернуться позже в пределах срока действия токена, и сессия продолжится (TelegramController при новом запуске по тому же токену должен найти незавершенную сессию и продолжить с нужного вопроса). Для упрощения можно не реализовывать повторный запуск по тому же токену (Telegram не вызовет /start второй раз с тем же токеном), а просто хранить состояние диалога внутри самого бота.

Алгоритм описанного процесса псевдокодом представлен в архитектурном документе. Он иллюстрирует логику сохранения ответа, проверки окончания опросника и перехода к следующему или завершению батча.

Агрегирование результатов и формирование отчёта

Когда все опросники батча пройдены (состояние COMPLETED), система должна обработать совокупность полученных результатов и подготовить итоговый отчет. Этот процесс включает:

Загрузка всех responses: BatchService извлекает все связанные результаты (по batch_session_id из batch_responses и далее достает каждую запись из responses или сразу делает JOIN). В массиве будут объекты, содержащие ответы и рассчитанные баллы по каждому опроснику.

Анализ по каждому опроснику: Для каждого результата доступна структура score_json (итоги расчётов этого опросника, согласно его шкалам). Система проходит по каждому:

Вычисляет/извлекает общий балл и метку уровня (например, "45/60 – высокий риск") и включает эту информацию в сводку.

Извлекает детальные показатели по подшкалам, если есть (например, для СДВГ: невнимательность, гиперактивность).

Собирает флаги/предупреждения, которые были выставлены в каждом опроснике (например, в M-CHAT мог быть флаг о социальных навыках). Эти флаги могут храниться в score_json.flags либо выводиться на основе баллов.

Добавляет краткое резюме по опроснику в список результатов.

Агрегирование общих показателей: Опционально, суммирует или собирает ключевые показатели по всем опросникам:

Например, можно собрать все флаги в один список (будут храниться в batch_reports.flags_json).

Можно свести общие баллы в единую структуру (aggregated_scores), например словарь {id_опросника: {score, label}}.

Если требуется, посчитать суммарное время прохождения (по completed_at - created_at, или собирая разницы).

Формирование текстового отчета: Генерируется человекочитаемый summary_text – многострочный текст, включающий по каждому опроснику итоговые баллы и уровни, а также общие выводы:

В разделе каждого опросника: название, набранные баллы из максимума (в процентах), уровень риска/нормы, перечисление результатов по подшкалам или ключевые ответы.

В конце – сводный раздел "Общие выводы" с перечислением основных результатов и рекомендаций (формулируется на основе комбинации флагов и баллов; например: "Выявлен высокий риск СДВГ... Рекомендуется консультация психиатра..."). Эти правила формирования выводов задаются экспертами и могут быть закодированы в функции generateOverallSummary(results).

Пример фрагмента отчета: для СДВГ: "Общий балл 45/60 (высокий риск); Невнимательность: 24/30; Гиперактивность: 21/30. Для M-CHAT: 8/20 – требуется внимание, флаг: проблемы с соц. взаимодействием. ..." и т.д., затем "Общие выводы: ...".

Этот текст сохраняется в поле batch_reports.summary_text и затем будет отправлен ботом администратору.

Сохранение отчета: Система сохраняет сгенерированные summary_text, aggregated_scores_json и flags_json в новую запись таблицы batch_reports, связанную с батч-сессией. Таким образом, отчет можно повторно запрашивать через API или отправлять повторно, не вычисляя заново.

Алгоритм агрегации показан в псевдокоде в архитектурном документе. Он демонстрирует сбор данных по каждому response и формирование итоговых структур и текста.

После генерации отчета BatchService вызывает TelegramController для уведомления: специалисту отсылается сообщение о завершении сессии (с указанием даты, времени, количества опросников) и предлагается кнопка "Посмотреть отчет". Эта часть – взаимодействие, описано далее в UX.

Важно, что никакого ручного пост-обработки результатов со стороны специалиста не требуется – весь расчет автоматизирован. Специалист получает уже готовый агрегированный вывод, уменьшая вероятность ошибок и экономя время.

5. Описание Telegram UX

Интерфейс взаимодействия с системой для конечных пользователей – это Telegram-бот. Он обслуживает две категории пользователей:

Специалист (администратор) – создает батчи и получает отчеты.

Клиент (респондент) – проходит опросы по выданной ссылке.

Все взаимодействие спроектировано через кнопки и меню, без необходимости ввода текстовых команд вручную. Ниже описан типовой сценарий использования бота.

Сценарий 1: Создание нового батча (для администратора)

Запуск администратором: Специалист (чей Telegram ID прописан в системе) начинает диалог с ботом. При первом запуске (/start) бот может показать приветствие и главное меню. Меню администратора содержит, например, кнопку "Создать батч". Специалист нажимает эту кнопку (вместо ввода команды) для начала процесса создания нового набора опросников.

Выбор опросников: Бот отправляет сообщение с заголовком, например: "📋 Создание батча опросников – выберите опросники (можно несколько):". Под сообщением – список кнопок с названиями доступных опросников. Каждая кнопка действует как переключатель (нажата – ✅ отмечено, нажата повторно – снято). Бот может динамически обновлять сообщение, отмечая выбранные опросники галочками. (Пример опросников: "СДВГ скрининг (22 вопроса)", "M-CHAT аутизм (22 вопроса)" и т.д.). Администратор отмечает необходимые анкеты.

Подтверждение создания: В том же сообщении или отдельном – кнопка "Создать батч" и кнопка "Отмена". Нажав "Создать батч", специалист подтверждает свой выбор.

Результат – ссылка для клиента: Бот формирует новый батч и отвечает сообщением: "✅ Батч из N опросников создан!", а также предоставляет:

Ссылка для клиента: уникальный URL вида https://t.me/<название_бота>?start=batch_ABC123... для запуска бота с токеном сессии. Специалист может эту ссылку переслать клиенту любым удобным способом (вне бота).

Срок действия: дата и время, до которого ссылка активна (например, "Действительна до: 2025-11-08 15:30").

Информация о батче: например, "Всего вопросов: 89" – суммарное количество вопросов во всех опросниках батча.

(Опционально: повтор списка опросников или описание батча).

Завершение работы администратора: На этом процесс создания батча окончен. Специалист ожидает, когда клиент пройдет опросы и пришлет результаты. Администратор может создать несколько разных батчей, если нужно, повторяя процесс.

(Если специалист нажал "Отмена" на этапе выбора, бот отменяет создание – можно прислать уведомление "Создание батча отменено." и вернуться в главное меню.)

Сценарий 2: Прохождение батча (для клиента)

Переход по ссылке: Клиент получает от специалиста ссылку на бот с параметром (например, batch_abc123xyz). При нажатии на эту ссылку в Telegram автоматически открывается чат с ботом и передается команда /start batch_abc123xyz в этот чат. Бот распознает токен и начинает сценарий прохождения.

Приветственное сообщение: Бот приветствует пользователя и объясняет суть опроса. Пример:

"👋 Добро пожаловать! Вам предстоит пройти 4 опросника (89 вопросов). Это займет ~20-30 минут. Вы можете делать перерывы – ваш прогресс сохраняется.".

Под сообщением – кнопки "Начать" и "Отмена". Нажав "Начать", пользователь подтверждает готовность.

Последовательность вопросов: Бот поочередно отправляет вопросы:

Перед первым вопросом бот сообщает название первого опросника: "📝 Опросник 1 из 4: СДВГ скрининг". Затем первый вопрос, например: "Вопрос 1 из 22: «Часто ли ребенок отвлекается?»".

К каждому вопросу бот прикрепляет варианты ответов как кнопки (например: "Никогда / Редко / Иногда / Часто / Всегда" для частотных оценок). Пользователь нажимает на выбранный вариант, после чего бот сразу присылает следующий вопрос.

Так продолжается до конца первого опросника. Пользователь отвечает на ~22 вопроса (количество зависит от опросника).

Переход между опросниками: Когда первый опросник завершен, бот отправляет сообщение: "✅ Опросник 1 из 4 завершен!" и сразу анонсирует следующий: "📝 Переходим к опроснику 2 из 4: M-CHAT (аутизм)", затем первый вопрос второго опросника. Пользователь продолжает отвечать без перерыва (если хочет).

Такая же схема повторяется для всех опросников в батче (например, 2-й M-CHAT, 3-й SDQ, 4-й Сенсорика).

Пользователь может прерываться между вопросами – если он закроет чат, ответы, данные до этого, не пропадут. При возвращении в чат бот может повторить последний незавершенный вопрос.

Если пользователь нажмет "Отмена" в любой момент, бот подтвердит отмену и завершит диалог.

Завершение всех опросников: После ответа на последний вопрос последнего опросника бот отправляет поздравительное сообщение: "🎉 Поздравляем! Все опросники завершены! Спасибо за участие. Специалист получит результаты в ближайшее время.". На этом взаимодействие с клиентом заканчивается – бот может больше не отправлять сообщений этому пользователю (либо предложить какие-то финальные кнопки, например, "Получить копию результатов на email" – но в рамках данного ТЗ это не требуется).

(Замечание: Ни на одном из этапов клиент не вводит текст – весь ввод сводится к нажатию кнопок. Это исключает риск ввода непредусмотренной команды.)

Сценарий 3: Получение отчета (для администратора)

Уведомление специалиста: Как только клиент завершил последний опросник, бот автоматически присылает администратору сообщение о завершении батча. Пример:

"📊 Клиент завершил батч опросников! Дата: 2025-11-06 16:30. Опросников: 4. Время прохождения: 28 минут."

К сообщению прикреплена кнопка "Посмотреть отчет".

Просмотр отчета: Администратор нажимает "Посмотреть отчет", после чего бот отправляет ему развернутый агрегированный отчет по результатам:

Отчет начинается с заголовка, например: "📊 АГРЕГИРОВАННЫЙ ОТЧЕТ".

Далее по каждому опроснику батча приведены итоги. Например:

"=== Опросник 1: СДВГ скрининг ==="
"Общий балл: 45/60 (75%)
Уровень: Высокий риск СДВГ
Детали:
• Невнимательность: 24/30 (высокий)
• Гиперактивность: 21/30 (высокий)"

"=== Опросник 2: M-CHAT (аутизм) ===
Общий балл: 8/20
Уровень: Требуется внимание
Флаги:
⚠️ Проблемы с социальным взаимодействием"

"=== Опросник 3: SDQ ===" (и т.д., опускается подробный вывод).

Затем раздел "=== ОБЩИЕ ВЫВОДЫ ===", где перечислено несколько главных пунктов:
• Выявлен высокий риск СДВГ
• Наблюдаются некоторые признаки РАС
• Рекомендуется комплексное обследование.

Под отчетом бот может добавить кнопки "Выгрузить JSON", "Выгрузить CSV", "Детальные ответы". Эти опции позволяют специалисту получить файл с результатами: JSON – структурированный отчет, CSV – таблицы с данными, а "Детальные ответы" – возможно, полный список ответов на каждый вопрос.

Экспорт результатов (при необходимости): Если специалист нажимает "Выгрузить JSON" или "CSV", бот генерирует и отправляет соответствующий файл (например, как документ в Telegram). JSON-файл содержит ту же информацию, что и отчет (см. API /exports/batch-report/...), CSV – табличное представление. Прямо в боте JSON/CSV может быть отправлен как файл-приложение. Это удобнее, чем PDF, поскольку позволяет импортировать данные в другие системы. PDF не реализуется в рамках MVP согласно требованиям – вместо этого доступны машиночитаемые форматы JSON/CSV.

Завершение цикла: После отправки отчета взаимодействие по данному батчу завершено. Администратор может архивировать результаты или продолжить работу (например, создать новый батч). Бот возвращается в ожидающее состояние (может показать меню администратора снова).

Весь описанный UX подтверждает, что интерфейс полностью кнопочный и на русском языке, что делает его интуитивно понятным. Ниже в разделе 10 приведены примеры текстов сообщений и диалогов из этих сценариев.

6. Поддерживаемые API (эндпойнты)

Помимо интерфейса бота, система предоставляет REST API для внешнего доступа к функционалу батч-опросов. API может быть использовано для интеграции с веб-интерфейсом администратора или другими сервисами. Ниже перечислены поддерживаемые эндпойнты и форматы запросов/ответов.

Общие сведения об API:

Базовый URL: по умолчанию http://localhost:8088 (порт настраиваемый через переменные окружения, например PORT). Все приведенные пути являются относительно базового URL.

Формат обмена: запросы и ответы используют JSON. В ответах успешные результаты оборачиваются в объект { "success": true, "data": ... }, ошибки – в { "success": false, "error": { "code": "...", "message": "..." } }.

Аутентификация: в текущей версии не требуется (открытый API). Предполагается, что доступ ограничен средой развёртывания. В будущем можно добавить JWT-токены или API-ключи для безопасности.

Коды ошибок: сервер возвращает стандартные HTTP-коды: 400 (неправильный запрос, валидация не пройдена), 404 (не найден ресурс, напр. несуществующий ID), 409 (конфликтное состояние, напр. повторная операция или уже завершено), 410 (Gone – ресурс более недоступен, напр. токен сессии истек), 500 (внутренняя ошибка сервера). В поле error.code приходит строковый код ошибки для программной обработки, а error.message – описание на русском.

Ниже описаны все реализуемые эндпойнты:

POST /batches – создание нового батча опросников

Описание: Создает новый батч, объединив указанные опросники. Возвращает ID созданного батча и базовую информацию.

Request (JSON): содержит данные батча:

{
  "title": "Название батча",           // обязательно, 1-500 символов
  "description": "Описание батча",    // опционально, до 2000 символов
  "questionnaire_ids": [             // массив ID опросников (UUID)
    "uuid1", "uuid2", "uuid3", ...
  ],
  "created_by_telegram_id": 123456789 // Telegram ID создателя батча
}


Пример запроса:

{
  "title": "Комплексное обследование ребенка",
  "description": "СДВГ + аутизм + эмоциональные трудности + сенсорика",
  "questionnaire_ids": [
    "b0263f2d-4345-4c31-b327-6b679cc983f4",
    "0676f6bb-b2c5-4606-a7d0-f9ce7cc1cb45",
    "37248454-8c47-4c8e-8fd7-d844bd3113a4",
    "6bc26668-9f80-43c2-8b9c-7949f20a2548"
  ],
  "created_by_telegram_id": 123456789
}


Response: при успешном создании возвращается статус 201 Created и JSON с данными батча:

{
  "success": true,
  "data": {
    "batch_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
    "title": "Комплексное обследование ребенка",
    "description": "СДВГ + аутизм + эмоциональные трудности + сенсорика",
    "questionnaires_count": 4,
    "created_at": "2025-11-06T15:30:00.000Z"
  }
}


Пример ответа демонстрирует, что сервер возвращает сгенерированный batch_id, эхо основных полей и questionnaires_count – количество опросников в батче (для проверки).

Валидация и ошибки:

Если не указаны title или список questionnaire_ids пустой/слишком большой, возвращается 400 Bad Request. Например, код ошибки INVALID_QUESTIONNAIRE_IDS при количестве ID вне диапазона.

Если какой-то из указанных questionnaire_ids не существует в системе, вернётся 404 Not Found с кодом QUESTIONNAIRE_NOT_FOUND.

Примечание: Поле created_by_telegram_id в запросе может проверяться на совпадение с разрешенным ID администратора, но т.к. API не аутентифицировано, эта проверка номинальная. Можно либо игнорировать поле (принимая его как часть данных), либо сверять и отказывать, если ID не совпадает с конфигом.

GET /batches/:batch_id – получение информации о батче

Описание: Возвращает подробную информацию о батче по его ID, включая список опросников, входящих в него.

Request: HTTP GET запрос по URL, где :batch_id – UUID батча.

Response: при успехе 200 OK и JSON:

{
  "success": true,
  "data": {
    "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
    "title": "Комплексное обследование ребенка",
    "description": "СДВГ + аутизм + эмоциональные трудности + сенсорика",
    "created_by_telegram_id": 123456789,
    "is_active": true,
    "created_at": "2025-11-06T15:30:00.000Z",
    "questionnaires": [
      {
        "order": 1,
        "id": "b0263f2d-4345-4c31-b327-6b679cc983f4",
        "title": "Скрининг СДВГ (6-17 лет)",
        "questions_count": 22
      },
      {
        "order": 2,
        "id": "0676f6bb-b2c5-4606-a7d0-f9ce7cc1cb45",
        "title": "M-CHAT-R - Скрининг аутизма (16-30 месяцев)",
        "questions_count": 22
      },
      ...
    ],
    "total_questions": 89
  }
}


Здесь массив questionnaires содержит каждый опросник в составе батча с указанием порядка, названия и количества вопросов, а поле total_questions даёт суммарное число вопросов (для справки).

Ошибки: Если батч с таким ID не найден – 404 Not Found (код ошибки BATCH_NOT_FOUND).

POST /batch-sessions – создание сессии для батча (генерация ссылки)

Описание: Создает новую сессию прохождения для указанного батча. Иными словами, генерирует одноразовую ссылку (токен) для клиента, по которой тот сможет пройти выбранный батч. Специалист может вызывать этот метод несколько раз для одного батча, получая независимые ссылки для разных клиентов.

Request (JSON):

{
  "batch_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
  "expiry_hours": 48    // (опционально) через сколько часов ссылка протухает
}


Здесь batch_id – обязательный UUID батча, а expiry_hours – не обязательное число часов до истечения ссылки (по умолчанию 48 часов, максимум 168 часов = 7 дней).

Response: при успехе 201 Created и JSON с параметрами новой сессии:

{
  "success": true,
  "data": {
    "session_id": "s1s2s3s4-s5s6-s7s8-s9s0-s1s2s3s4s5s6",
    "token": "batch_abc123xyz456def789ghi",
    "link": "https://t.me/neiropsy_bot?start=batch_abc123xyz456def789ghi",
    "batch_title": "Комплексное обследование ребенка",
    "questionnaires_count": 4,
    "total_questions": 89,
    "expires_at": "2025-11-08T15:30:00.000Z"
  }
}


Пример ответа показывает, что возвращаются:

session_id – UUID созданной сессии.

token – строка токена (начинается с префикса batch_ для удобства).

link – полный URL для запуска бота (содержит тот же токен).

Дополнительная информация: batch_title (название батча, дублируется для удобства), questionnaires_count и total_questions (чтобы сразу видеть объем работы), expires_at (точное время истечения).

Ошибки:

Если указанного батча нет – 404 Not Found (код BATCH_NOT_FOUND).

Если expiry_hours вне допустимого диапазона (например, 0 или >168) – 400 Bad Request (код INVALID_EXPIRY_HOURS).

Если батч помечен как неактивный (is_active = false), можно вернуть 409 Conflict (код BATCH_INACTIVE), хотя в спецификации прямо не указано – это можно предусмотреть для полноты.

GET /batch-sessions/:token – проверка статуса батч-сессии

Описание: Проверяет состояние сессии по её токену. Может использоваться, например, внешней системой, чтобы узнать, завершил ли клиент опросы, или показать прогресс.

Request: GET запрос, где :token – токен с префиксом batch_ (точно такой, какой выдается в ссылке).

Response: 200 OK и данные сессии:

{
  "success": true,
  "data": {
    "session_id": "s1s2s3s4-s5s6-s7s8-s9s0-s1s2s3s4s5s6",
    "batch_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
    "batch_title": "Комплексное обследование ребенка",
    "completed": false,
    "expires_at": "2025-11-08T15:30:00.000Z",
    "is_expired": false,
    "progress": {
      "total_questionnaires": 4,
      "completed_questionnaires": 2,
      "percentage": 50
    }
  }
}


Здесь:

completed – флаг, завершена ли сессия (true, если клиент прошел все опросники и отчет готов).

is_expired – флаг, истекло ли время действия токена (true, если текущее время > expires_at и опрос не завершен).

progress – объект с прогрессом: сколько опросников всего и пройдено, а также процент завершения.

Если completed = true, можно ожидать, что в progress.percentage будет 100, и completed_questionnaires == total_questionnaires.

Ошибки:

Если токен не найден – 404 Not Found (код SESSION_NOT_FOUND).

Если токен найден, но срок истек – 410 Gone (код SESSION_EXPIRED).

Если сессия найдена, но уже была ранее завершена – 409 Conflict (код BATCH_COMPLETED, смысл: нельзя повторно использовать).
(Последний случай маловероятен для GET-запроса, скорее это защита от повторного запуска, но спецификация его упоминает.)

GET /batch-reports/:batch_session_id – получение агрегированного отчета

Описание: Возвращает агрегированный отчет по завершенной батч-сессии. Содержит сводную информацию по всем опросникам и выводы. Может использоваться для отображения результатов вне Telegram.

Request: GET запрос, где :batch_session_id – UUID сессии (не токен, а именно ID записи).

Опциональный query-параметр include_responses=true – если указать, в ответ будут включены детальные ответы по каждому вопросу. По умолчанию false (детали не включаются).

Response: 200 OK и JSON с отчетом:

{
  "success": true,
  "data": {
    "batch_session_id": "s1s2...s6",
    "batch_title": "Комплексное обследование ребенка",
    "completed_at": "2025-11-06T16:45:00.000Z",
    "duration_minutes": 28,
    "questionnaires": [
      {
        "order": 1,
        "title": "Скрининг СДВГ (6-17 лет)",
        "overall_score": 45,
        "overall_label": "Высокий риск СДВГ",
        "scales": [
          { "id": "inattention", "label": "Невнимательность", "score": 24, "level": "high" },
          { "id": "hyperactivity", "label": "Гиперактивность", "score": 21, "level": "high" }
        ]
      },
      {
        "order": 2,
        "title": "M-CHAT-R - Скрининг аутизма",
        "overall_score": 8,
        "overall_label": "Требуется внимание",
        "scales": []
      },
      ...
    ],
    "summary": "=== АГРЕГИРОВАННЫЙ ОТЧЕТ ===\n\n📊 Опросник 1: ... (см. пример в разделе 10)\n...",
    "flags": [
      "Высокий риск СДВГ",
      "Требуется внимание (M-CHAT)",
      "Умеренные сенсорные проблемы"
    ],
    "recommendations": [
      "Консультация детского психиатра по СДВГ",
      "Углубленная диагностика аутистического спектра",
      "Консультация эрготерапевта по сенсорным проблемам"
    ]
  }
}


Ответ содержит:

completed_at – время завершения сессии.

duration_minutes – длительность прохождения, мин.

questionnaires – массив по каждому опроснику с итоговыми баллами. Здесь приведены примеры: опросник СДВГ получил 45 (высокий риск), с деталями по двум шкалам; M-CHAT – 8 (требуется внимание), и т.д. В каждом объекте могут быть подмассивы scales с баллами по шкалам внутри опросника.

summary – готовый текст отчета (с теми же данными в текстовом виде, включая общие выводы).

flags – список флагов/ключевых выводов без объяснений (короткие метки риска).

recommendations – список рекомендуемых действий (если предусмотрено методикой).

Если include_responses=true, дополнительно мог бы быть массив detailed_responses со всеми ответами на уровне вопросов, но можно не приводить пример (в JSON экспорт это детально указано).

(Примечание: Поле recommendations было в расширенном примере API. Возможно, в MVP можно объединить рекомендации с flags или включить их в summary_text.)

В упрощенном примере без scales и рекомендаций отчет может выглядеть так (данные из архитектурного документа):

{
  "success": true,
  "data": {
    "batch_session_id": "uuid-session-1",
    "completed_at": "2025-11-06T16:30:00Z",
    "summary_text": "...",
    "questionnaires": [
      {
        "title": "СДВГ скрининг",
        "overall_score": 45,
        "overall_label": "Высокий риск"
      },
      ...
    ],
    "flags": [
      "Высокий риск СДВГ",
      "Требуется внимание (аутизм)"
    ]
  }
}


Это показывает минимальную структуру: названия опросников и их итоговые оценки, список флагов и summary_text (здесь опущен).

Ошибки:

Если отчет для указанной сессии не найден (например, неверный batch_session_id или сессия не завершена) – 404 Not Found (код REPORT_NOT_FOUND).

Если сессия ещё не завершена – 409 Conflict (код BATCH_NOT_COMPLETED, сообщение может включать сколько опросников пройдено).

Если batch_session_id формат неверный – 400 Bad Request.

GET /exports/batch-report/:batch_session_id.json – экспорт отчета в JSON

Описание: Позволяет скачать полный отчет в виде JSON-файла. Эквивалентно вызову /batch-reports/:id?include_responses=true, но с заголовками Content-Disposition для загрузки файла.

Request: GET запрос по указанному URL. Параметр :batch_session_id – UUID сессии.

Response: 200 OK, тело ответа – JSON-документ. Заголовок Content-Disposition указывает имя файла, например batch-report-s1s2s3s4.json. Структура содержимого включает более подробные поля, например:

{
  "metadata": {
    "export_date": "2025-11-06T17:00:00.000Z",
    "batch_session_id": "s1s2...s6",
    "format_version": "1.0"
  },
  "batch_info": { ... },                 // информация о батче (название, создатель, и т.д.)
  "questionnaires_results": [ ... ],     // массив результатов по каждому опроснику (похоже на /batch-reports)
  "aggregated_summary": { ... },         // агрегированные баллы, флаги, выводы (то, что в batch_reports)
  "detailed_responses": [ ... ]          // при include_responses: детальные ответы на каждый вопрос
}


(В MVP можно опустить detailed_responses или включать по требованию.)

Ошибки: аналогичны GET /batch-reports/:id (404 или 409, например, если не завершено).

Примечание: Этот эндпойнт в ответ не оборачивает данные в {"success":true,"data":...}, он сразу отдает файл. Content-Type: application/json.

GET /exports/batch-report/:batch_session_id.csv – экспорт отчета в CSV

Описание: Скачивание отчета в формате CSV (табличные данные). Поддерживает два варианта представления: summary (по умолчанию) и detailed (с подробными ответами).

Request: GET запрос. Обязательный параметр пути – :batch_session_id (UUID сессии). Опциональный query-параметр format может быть:

summary (по умолчанию) – экспорт сводных результатов,

detailed – экспорт с детальными ответами.

Response: 200 OK, заголовки: Content-Type: text/csv, Content-Disposition: attachment; filename="batch-report-<session_id>.csv". Тело – CSV-данные.

В режиме summary каждая строка представляет итог по одной шкале одного опросника либо общий балл, например:

batch_session_id,completed_at,questionnaire_order,questionnaire_title,overall_score,overall_label,scale_id,scale_label,scale_score,scale_level
s1s2...s6,2025-11-06T16:45:00Z,1,Скрининг СДВГ,45,Высокий риск СДВГ,inattention,Невнимательность,24,high
s1s2...s6,2025-11-06T16:45:00Z,1,Скрининг СДВГ,45,Высокий риск СДВГ,hyperactivity,Гиперактивность,21,high
s1s2...s6,2025-11-06T16:45:00Z,2,M-CHAT-R,8,Требуется внимание,,,,
...


Пример строкпоказывает, что для M-CHAT, у которого нет подшкал, поля scale остаются пустыми.

В режиме detailed каждая строка – ответ на отдельный вопрос:

batch_session_id,completed_at,questionnaire_order,questionnaire_title,question_key,question_text,answer_value,answer_label
s1s2...s6,2025-11-06T16:45:00Z,1,Скрининг СДВГ,q1,"Часто ли ребенок отвлекается?",4,Очень часто
s1s2...s6,2025-11-06T16:45:00Z,1,Скрининг СДВГ,q2,"Трудно ли сосредоточиться?",3,Часто
...


В этом формате представлены тексты вопросов и выбранные ответы.

(На этапе реализации важно экранировать запятые и кавычки в CSV должным образом.)

Ошибки: аналогично – 404 если не найдено, 409 если не завершено. Формат ошибок – вместо CSV, возвращается JSON с описанием ошибки (или статус 400/404).

Итого по API: перечисленные эндпойнты покрывают создание батча, управление сессиями и извлечение результатов. Они соответствуют действиям, доступным через бота, что позволяет при необходимости выполнить любые операции программно. В случае расхождений между функциональностью бота и API приоритет – на соответствие требованиям UX (бота), API же следует сделать консистентным с ними.

7. Требования к тестированию и приёмке

Для успешной сдачи проекта необходимо провести всестороннее тестирование функциональности бота и API. Ниже перечислены основные требования к тестированию и критерии приёмки:

Функциональное тестирование:

Провести юнит-тесты ключевых модулей бизнес-логики:

Алгоритм перехода между опросниками (FSM): тесты на последовательность состояний при различных сценариях (нормальный проход без остановок, с отменой, с перерывами, с истечением срока).

Алгоритм сохранения и загрузки состояния: имитация ответов пользователя, проверка корректности сохранения ответов и переходов, особенно на границах (последний вопрос, последний опросник).

Функция агрегации результатов: на входе несколько смоделированных responses с разными баллами – проверить, что на выходе правильно суммируются флаги, баллы и формируется ожидаемый текст отчета.

Провести интеграционное тестирование бота:

С помощью Telegram API или библиотек-эмуляторов написать сценарные тесты:

Сценарий полного прохождения: симулировать сообщения от администратора для создания батча (выбор нескольких опросников, подтверждение), затем от имени клиента отправить команду /start batch_token и последовательность ответов на вопросы, и в конце проверить, что администратору пришло уведомление и отчет. Убедиться, что текст отчета соответствует ожидаемому (при известных тестовых ответах).

Сценарий отмены: проверить, что если клиент нажимает "Отмена" в середине, бот корректно останавливает опрос (может прислать сообщение о прекращении, сессия в БД помечается как не завершенная). Администратору не должен сформироваться отчет, API /batch-reports для этой сессии должен вернуть ошибку BATCH_NOT_COMPLETED.

Сценарий просрочки: создать сессию с коротким expiry_hours, симулировать запуск после истечения – бот должен отказать (например, прислать "Ссылка устарела"). API /batch-sessions/token должно возвращать is_expired = true или ошибку 410. Попытка продолжить ранее начатый опрос после истечения также не должна приводить к ошибкам (можно либо позволить дочитать до конца с предупреждением, либо остановить – это решить в реализации; тестировать выбранное поведение).

Проверить различные типы опросников: например, с разным количеством вопросов, с подшкалами и без – убедиться, что бот не ломается на границах (на 2 опросника, на 10 опросников – максимуме).

Убедиться, что весь интерфейс на русском: ни в одном сообщении нет необъясненных англицизмов или разработческих текстов (например, "undefined" или исключений). Тексты должны совпадать с утвержденными примерами.

Проверить, что кнопки работают корректно: нажатие каждой кнопки приводит к правильной реакции бота. Нет "мертвых" кнопок или неправильных переходов. Например, кнопки выбора опросников при создании батча – можно понажимать разные комбинации, отменить и снова открыть – состояние должно правильно сбрасываться.

Протестировать API эндпойнты:

Инструментом типа Postman или автотестами проверить каждый эндпойнт с допустимыми и недопустимыми данными.

Позитивные сценарии: создание батча через API (со валидными questionnaire_ids), получение списка опросников, создание сессии, имитация прохождения (например, можно написать скрипт, который создаст responses и batch_responses в БД – или сделать дополнительный служебный эндпойнт для теста), затем получить отчет через API.

Негативные сценарии: запросы с невалидным JSON (ожидается 400), с неверными UUID (404), повторное создание сессии по тому же batch (должно быть ок, несколько сессий допускается), запрос отчета по незавершенной сессии (409), запрос экспорта CSV/JSON по незавершенной или несуществующей сессии (409/404).

Особое внимание – соответствие спецификации: проверить, что все поля в ответах присутствуют и имеют корректный формат (временны́е метки в ISO строке, поля success, error и т.д.).

Тестирование границ и производительности:

Создать батч с минимальным количеством опросников (2) и убедиться, что всё работает.

Создать батч с максимальным (10) опросников, каждый с большим числом вопросов, провести через него "клиента" – убедиться, что бот выдерживает длинную сессию, все ответы сохраняются и отчет корректно генерируется. Замерить время генерации отчета – оно должно быть приемлемым (обычно доли секунды).

Одновременное прохождение: в реальности, может быть, несколько клиентов будут проходить разные батчи одновременно. Стоит имитировать 2 параллельные сессии (2 разных токена, 2 "виртуальных клиента") – убедиться, что бот правильно различает их (на основе chat_id) и состояния не путаются. Это особенно важно при использовании глобального состояния – тест покажет необходимость раздельного хранения (по chat_id).

Тест на повторное использование токена: убедиться, что повторный заход по уже использованному токену (после завершения) не приводит к срыву логики. Ожидаемо, бот может сообщить "этот опрос уже пройден" или просто игнорировать. API при этом /batch-sessions/:token возвращает completed=true.

UI/UX тестирование:

Проверить удобство: тексты сообщений в боте должны быть грамотными, понятными. Желательно провести просмотр глазами стороннего человека или бизнес-аналитика, чтобы убедиться, что формулировки соответствуют ожиданиям.

Проверить, что все ветки диалога покрыты (например, создание батча – успешное и отмена, прохождение – успешное и отмена, истечение – уведомление).

Проверить, что никакие ошибки (стек-трейсы, raw JSON) не сыплются в чат бота даже при нештатных ситуациях (например, если нажать не ту кнопку вне контекста).

Требования приёмки (Acceptance Criteria):

Все описанные функции реализованы: создание батча через бота и API, прохождение опросов через бота, уведомление и отчет, эндпойнты получения результатов.

Все автоматические тесты проходят (при наличии CI/CD – должен быть зеленый билд). Покрытие юнит-тестами желательно не ниже 70-80% для критичных частей.

При демонстрации вручную:

Специалист успешно создает батч из произвольных (тестовых) опросников и получает ссылку.

Клиент проходит по ссылке, отвечает на вопросы. В процессе можно сделать паузу, выйти и зайти – прогресс не теряется (в пределах одного запуска бота).

После последнего вопроса в чате администратора почти мгновенно появляется уведомление. По нажатию выдается корректный отчет, содержащий правильно агрегированные данные, соответствующие ответам клиента.

Файлы JSON/CSV корректно выгружаются и открываются (JSON валидный, CSV открывается в Excel/Google Sheets без нарушений структуры).

Логирование: в логах сервера фиксируются основные шаги (для отладки). Отсутствуют необработанные исключения или ошибки в консоли при стандартном сценарии.

Документация обновлена (текущий документ является техническим заданием; по завершении разработки должна быть подготовлена пользовательская инструкция для специалиста, если требуется).

Производительность: приёмка считается пройденной, если бот работает без заметных задержек для пользователя. Ожидается, что время от ответа пользователя до следующего вопроса < 1 секунды, время генерации отчета < 2 секунд для 4-5 опросников. Если возникают задержки, они должны быть обоснованы и приемлемы.

Приёмка осуществляется ответственным лицом, имитирующим роль администратора и клиента. Все найденные несоответствия функциональным требованиям или критические баги должны быть исправлены.

8. Нефункциональные требования

Кроме основной функциональности, система должна удовлетворять ряду нефункциональных критериев:

Надёжность и отказоустойчивость: Приложение должно корректно обрабатывать ошибки и исключительные ситуации:

Если внешний сервис (например, Telegram API) временно недоступен, бот должен не падать, а пытаться повторить запрос или логгировать проблему.

Данные должны сохраняться транзакционно: например, если при сохранении ответов произошел сбой, система не должна пометить сессию как завершенную. Использование транзакций БД или соответствующих ORM механизмов обязательно при создании батча (несколько таблиц) и завершении опроса (сохранение response + batch_response + обновление session).

Сохранность прогресса: на случай перезапуска приложения, по возможности, состояние текущих незавершенных сессий должно быть восстановлено. (Рекомендуется использовать Redis или сохранить прогресс текущего опросника в batch_sessions, например доп. поле current_index – однако, это доп. усложнение. Для MVP достаточно документировать, что при перезапуске в ходе сессии прогресс может потеряться.)

Приложение не должно крашиться при неожиданных входных данных от пользователя (например, если Telegram прислал сообщение не кнопкой, а текстом – бот должен игнорировать или выдать подсказку, а не упасть).

Производительность: Хотя нагрузка на систему ожидается невысокой (бот используется одним администратором и периодически несколькими клиентами), код должен быть написан эффективно:

Обработка каждого вопроса и сохранение ответа – операции быстрые (запись в память/Redis, возможно вставка в БД каждые ~20 ответов). Система должна легко выдерживать несколько параллельных сессий (например, 5–10 клиентов одновременно без деградации).

Использование асинхронности Node.js: не блокировать event loop на долгие операции. Длительные вычисления (агрегация, формирование PDF – которого нет) отсутствуют либо очень быстрые (расчет сумм баллов). Поэтому система в одном процессе способна обслуживать нужный объем.

При генерации отчетов и экспорта предусмотреть обработку в памяти объектов размером, соответствующим max 10 опросникам * ~100 вопросов = 1000 ответов, что не проблема. CSV/JSON формируются построчно/поточно если нужно, чтобы не съесть всю память при больших данных (на будущее).

Время отклика API: <100 мс на простые запросы (создание батча, получение инфо), <500 мс на генерацию отчета.

Время ответа бота: Telegram API polling/Webhook задержка минимальна, ответы на кнопки должны приходить быстро. Желательно использовать webhook для мгновенности, но polling (с интервалом ~1 сек) тоже приемлемо.

Масштабируемость: Монолит можно запускать в нескольких экземплярах за балансировщиком для повышения пропускной способности, но тогда требуется общий Redis для хранения состояний сессий, иначе ответы могут потеряться при распределении по разным инстансам.

Безопасность:

API не требует авторизации, поэтому рекомендуется ограничить доступ к нему на уровне сети (например, брандмауэром, VPN или запуском на localhost). В данных, приходящих по API, всё равно делается базовая валидация (на длину строк, форматы UUID и т.п.) с целью избежать SQL-инъекций или ошибок выполнения.

Telegram бот токен хранится в переменных окружения, не в коде, и не логируется. Желательно, чтобы репозиторий не содержал секретов.

Так как Telegram ID администратора известен и зашит, злоумышленник не сможет воспользоваться ботом для создания батча (бот просто игнорирует команды от чужих ID). Однако, сам API /batches теоретически открыт – поэтому, повторимся, он не должен быть общедоступным. В дальнейшем можно внедрить простой механизм авторизации (например, проверка created_by_telegram_id против списка разрешенных).

Токены сессий (batch_...) генерируются достаточно сложными (например, UUID либо случайная строка 16+ символов), чтобы их нельзя было подобрать перебором. Даже при знании batch_id злоумышленник не сможет угадать действующий токен.

Ограничение попыток: бот и API должны защищаться от спама. Например, бот не должен позволять бесконечно создавать батчи (но у нас один админ – не проблема). API можно оснастить простейшим Rate Limiting (например, не более 5 запросов создания в минуту) – это упомянуто как возможное улучшение.

Защита данных: результаты опросов могут быть чувствительными, поэтому доступ к БД должен быть ограничен, а дампы – защищены. При передаче JSON/CSV с результатами убедиться, что они идут только доверенному получателю (в нашем случае – по запросу администратора или через бот ему же).

Логирование и отслеживаемость:

В приложении настроить понятное логирование: для важнейших событий (создан батч, начата сессия, завершена сессия, отчет сгенерирован, ошибка произошла) лог должен содержать идентификаторы (batch_id, session_id) и описание.

Логи ошибок должны содержать стек вызывов для упрощения отладки.

Желательно не логировать персональные данные клиентов или содержимое ответов (чтобы не нарушать приватность). Достаточно логировать агрегированные результаты или техническую информацию.

Если используем webhook, вести лог входящих обновлений от Telegram (в debug-режиме).

Можно реализовать элемент аудита: каждое создание батча, прохождение и т.п. фиксируется в базе (в принципе, у нас и так остается запись). Но отдельно не требуется.

Поддерживаемость и расширяемость:

Код должен быть структурирован по модулям, следовать принципам SOLID. Например, выделить сервисы, контроллеры, не смешивать логику работы с Telegram API и бизнес-логику.

Использование TypeScript – обязательное требование, все основные структуры (Batch, Questionnaire, Response, Report) должны иметь интерфейсы/классы с четко определенными типами. Это предотвратит множество ошибок на этапе разработки.

Добавление новых опросников или изменение логики не должно требовать переписывания всей системы. Например, если нужно поменять алгоритм расчета выводов, достаточно обновить generateOverallSummary.

В документе улучшений (необязательно для MVP) отмечены такие возможности, как аутентификация, pagination списков, webhook-уведомления. Архитектура монолита не должна препятствовать их реализации в будущем.

Совместимость:

Приложение запускается в Docker-контейнере на Linux (базовый образ Node.js LTS).

База данных – PostgreSQL (версии 12+). Код SQL/ORM запросов должен быть совместим с PostgreSQL. В случае использования SQLite для разработки тесты, убедиться, что синтаксис переносим.

TelegramController совместим с API Telegram Bot версии 2025 (на дату разработки). Используемое API (методы sendMessage, sendDocument, editMessageText и т.д.) – стандартные и будут поддерживаться.

Клиентская часть – любой Telegram клиент (мобильный, десктоп) должен правильно отображать сообщения (например, emoji, форматирование Markdown/HTML – нужно проверить на разных платформах).

Экспорт CSV/JSON проверен на открытие в MS Excel, Google Sheets, а JSON – парсится стандартными библиотеками (т.е. корректная кодировка UTF-8, правильные запятые и кавычки).

Подводя итог, система должна работать стабильно, быстро и безопасно, не доставляя проблем ни пользователям, ни сопровождению.

9. Развёртывание и конфигурация (Docker Compose, окружение)

Для облегчения развёртывания поставляется конфигурация Docker Compose, позволяющая запустить все необходимые компоненты. Состав контейнеров:

app (nodejs) – само Node.js приложение (бот + API).

db (postgres) – контейнер с PostgreSQL для хранения данных.

redis – контейнер с Redis (опционально, при необходимости включается для хранения состояний).

(Возможно, adminer или pgAdmin – опционально для удобства отладки БД, не для продакшена).

Переменные окружения: Приложение настраивается через следующие env-переменные (указываются в docker-compose.yaml или .env файле):

TELEGRAM_BOT_TOKEN – токен HTTP API для Telegram-бота (полученный у BotFather). Обязательно: без него бот не запустится.

ADMIN_TELEGRAM_ID – числовой Telegram ID администратора (того, кто будет создавать батчи). Можно узнать свой ID через внешние сервисы или специального бота. Приложение использует это значение для проверки прав.

DATABASE_URL – URL подключения к PostgreSQL. Например: postgres://user:pass@db:5432/mydatabase. В Docker Compose может использоваться сервисное имя db как хост.

Либо использовать отдельные DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD – в зависимости от того, как настроено приложение/ORM.

REDIS_URL – (опционально) строка подключения к Redis, если используется. Например: redis://redis:6379/0. Если не указана, приложение решает использовать in-memory хранение состояния.

PORT – порт, на котором запускается HTTP-сервер для API. По умолчанию 8088, как в спецификации. В Docker Compose этот порт маппится на хост-машину, если необходимо.

NODE_ENV – окружение Node (production/development). В продакшене можно установить NODE_ENV=production для отключения лишних логов и ускорения.

Docker Compose файл:
Пример (фрагмент):

version: '3.8'
services:
  app:
    build: .  # Докерфайл собирает Node.js приложение
    ports:
      - "8088:8088"
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    command: ["redis-server", "--save", ""]  # можно отключить сохранение на диск для производительности
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:


В .env файле должны быть заданы TELEGRAM_BOT_TOKEN, ADMIN_TELEGRAM_ID и креденшиалы БД, чтобы вышеуказанный compose корректно поднялся. Приложение должно учитывать, что в контейнере db база может запускаться не сразу – желательно добавить небольшую задержку или retry подключения при старте.

Запуск и первоначальная настройка:

Перед первым запуском заполнить .env файл необходимыми значениями.

Выполнить docker-compose up -d – это запустит БД, Redis и приложение.

Приложение может при старте применять миграции к базе (если используется миграционный инструмент или ORM с auto-migrate) для создания новых таблиц (questionnaire_batches, etc.). Либо требуется заранее применить SQL-скрипт с созданием схемы (см. раздел 3 для структуры).

После старта убедиться, что бот подключился к Telegram (в логах должно быть что-то вроде "polling started" или подтверждение webhook).

Протестировать: отправить команду /start боту из-под администратора и убедиться, что бот отвечает (приветствием/меню).

Готово – можно создавать батчи и пользоваться.

Дополнительные настройки:

Логи внутри контейнера app можно собирать через docker logs или настроить output в файл/стек.

В docker-compose.prod.yaml (при необходимости) можно добавить настройки для масштабирования app (несколько реплик) – но как отмечалось, для этого нужен Redis и sticky sessions для webhook, либо просто использовать polling (каждый инстанс будет получать все сообщения, что не хорошо). В MVP достаточно одного инстанса.

Развёртывание без Docker: Если требуется, приложение можно запустить напрямую:

Нужно установить Node.js >= 18, PostgreSQL.

Настроить .env, запустить npm install, затем npm run build (если TypeScript) и npm start.

Но Docker предпочтителен для одинаковости окружений.

В итоге, Docker Compose обеспечивает быстрый запуск всей системы. Разработчики и тестировщики могут поднять контейнеры, не устанавливая локально СУБД и прочее. Контейнеризация также облегчает последующее деплоймент на сервер.

10. Примерные тексты для Telegram-интерфейса

Ниже приведены примеры сообщений и диалогов, которые демонстрируют поведение бота в разных сценариях. Эти тексты можно использовать в реализации непосредственно или в качестве основы.

Диалог создания батча (администратор)
Специалист: [нажимает кнопку "Создать батч"]

Бот: 📋 Создание батча опросников  
     Выберите опросники (можно несколько):

     [✅ СДВГ скрининг (22 вопроса)]  
     [✅ M-CHAT аутизм (22 вопроса)]  
     [✅ SDQ трудности (27 вопросов)]  
     [✅ Сенсорная чувствительность (18 вопросов)]  

     [Создать батч]    [Отмена]

Специалист: [нажимает "Создать батч"]

Бот: ✅ Батч из 4 опросников создан!  

     Ссылка для клиента:  
     https://t.me/neiropsy_bot?start=batch_abc123xyz  

     Действительна до: 2025-11-08 15:30  
     Всего вопросов: 89


Комментарии:

В этом примере специалист выбрал 4 опросника (они отмечены галочками). Бот отобразил их список и предложил подтвердить создание.

Ссылка сформирована и выдана. Специалист её копирует и пересылает клиенту.

Кнопка "Отмена" позволяла отказаться от создания – в этом случае бот мог бы прислать сообщение "Создание батча отменено." и вернуться в меню.

Диалог прохождения опросов (клиент)
Пользователь: (переходит по выданной ссылке, запускается /start с токеном batch_abc123xyz)

Бот: 👋 Добро пожаловать!  
     
     Вам предстоит пройти 4 опросника (89 вопросов).  
     Это займет примерно 20-30 минут.  
     
     Вы можете делать перерывы – ваш прогресс сохраняется.  
     
     [Начать]    [Отмена]

Пользователь: [Начать]

Бот: 📝 Опросник 1 из 4: СДВГ скрининг  
     
     Вопрос 1 из 22:  
     "Часто ли ребенок отвлекается?"  
     
     [Никогда] [Редко] [Иногда] [Часто] [Всегда]

... (пользователь отвечает на последующие вопросы 2..22 теми же нажатием кнопок) ...

Бот: ✅ Опросник 1 из 4 завершен!  
     
     📝 Переходим к опроснику 2 из 4: M-CHAT (аутизм)  
     
     Вопрос 1 из 22:  
     "Смотрит ли ребенок в глаза?"  
     ... [варианты ответа] ...

... (после аналогичного прохождения опросников 2, 3, 4) ...

Бот: 🎉 Поздравляем! Все опросники завершены!  
     
     Специалист получит результаты в ближайшее время.  
     Спасибо за участие!


Комментарии:

Пользователь нигде не вводит текст – только нажимает кнопки "Начать", варианты ответов. Даже команду /start он фактически не вводил, она сработала из ссылки.

После каждого опросника бот дает краткий фидбэк и автоматически переходит к следующему. Пользователю не нужно нажимать "Далее" – сделано для ускорения процесса.

По окончании бот вежливо завершает диалог. Можно по желанию предложить пользователю что-то еще (например, подписаться на новости), но это вне рамок задачи.

Диалог получения отчета (администратор)
[Автоматическое уведомление специалисту]

Бот: 📊 Клиент завершил батч опросников!  
     
     Дата: 2025-11-06 16:30  
     Опросников: 4  
     Время прохождения: 28 минут  
     
     [Посмотреть отчет]

Специалист: [Посмотреть отчет]

Бот: 📊 АГРЕГИРОВАННЫЙ ОТЧЕТ  
     
     === Опросник 1: СДВГ скрининг ===  
     Общий балл: 45/60 (75%)  
     Уровень: Высокий риск СДВГ  
     
     Детали:  
     • Невнимательность: 24/30 (высокий)  
     • Гиперактивность: 21/30 (высокий)  
     
     === Опросник 2: M-CHAT (аутизм) ===  
     Общий балл: 8/20  
     Уровень: Требуется внимание  
     
     Флаги:  
     ⚠️ Проблемы с социальным взаимодействием  
     
     === Опросник 3: SDQ ===  
     ...  
     
     === ОБЩИЕ ВЫВОДЫ ===  
     • Выявлен высокий риск СДВГ  
     • Наблюдаются некоторые признаки РАС  
     • Рекомендуется комплексное обследование  
     
     [Выгрузить JSON] [Выгрузить CSV] [Детальные ответы]


Комментарии:

Уведомление приходит именно тому Telegram ID, который указан как админ. Если бот запущен у специалиста, он гарантированно получит сообщение, даже если чат был закрыт (Telegram доставит при следующем открытии).

Отчет содержит эмодзи и форматирование (можно использовать MarkdownV2 или HTML для жирного текста и т.д.). В примере показано текстом, но предполагается, что бот отправит это в моноспате или как есть – Telegram обычно сохраняет переводы строк.

Кнопки "Выгрузить JSON/CSV" при нажатии отправят файлы. "Детальные ответы" может либо выдать еще одно текстовое сообщение со списком всех ответов, либо тоже файл (например, CSV detailed, как дублирование). Вероятно, лучше сделать: JSON и CSV – файлы, а "Детальные ответы" – просто еще одно сообщение текстом (но если ответов много, лучше файл).

Специалист, получив отчет, может при необходимости переслать его или сохранить. JSON пригодится для систем учета, CSV – для Excel, что удовлетворяет требованию выдавать результаты без PDF.

Примечание: Все тексты сообщений должны быть вычитаны на предмет корректности языка. Например, в зависимости от контекста, вместо "опросников: 4" можно писать "Количество опросников: 4". В ТЗ представлены примерные варианты, разработчики могут слегка менять формулировки, не отступая от смысла.

Также важно учесть единственное/множественное число в русских сообщениях (например, "опросников: 1" – должно быть "опросник: 1"). Для этого можно реализовать небольшую функцию склонения, но допускается оставить без динамического склонения в MVP.

Загрузка опросников через REST API

Добавление опросников выполняется исключительно через REST API (веб-интерфейс не используется).

Право добавления есть только у администратора. В запросе должен быть указан Telegram ID пользователя – либо в заголовке (например, X-Telegram-ID), либо в теле JSON (поле telegram_id). Сервер сравнивает переданный Telegram ID с конфигурируемым списком администраторов. В случае отсутствия ID или несоответствия – возвращается ошибка 401/403.

Опросник состоит из двух частей в формате JSON:

questionnaire – набор вопросов, соответствует структуре файлов-примеров (title, version, language, questions и т.д.).

scoring – правила оценки, соответствует структуре файлов-примеров (scales, overall и т.д.).

Эти файлы можно загружать как вместе (оба поля в одном запросе), так и по отдельности. При загрузке новой версии (с теми же title и version) старые версии опросника и связанных правил оценки удаляются и заменяются новой информацией. Таким образом, дублирование title+version не вызывает ошибки – старое перезаписывается.

Формат данных

Поле questionnaire (объект) должно содержать, как минимум, следующие поля:

title (string) – уникальное название опросника.

version (string) – версия опросника.

language (string) – язык опросника.

questions (array) – список вопросов (каждый вопрос – объект с необходимыми полями, как в примере файлов).

Поле scoring (объект) должно содержать:

scales (array) – список шкал и их правил.

overall (object) – общие правила подсчёта (структура как в примерах).

Эндпоинт POST /questionnaires

URL: /questionnaires

Метод: POST

Заголовки:

Content-Type: application/json

Опционально: X-Telegram-ID: <Telegram ID администратора> (либо можно передать telegram_id в теле)

Тело запроса

JSON-объект с полями:

telegram_id (integer) – Telegram ID администратора (если не передано в заголовке).

questionnaire (object, опционально) – данные опросника (см. выше).

scoring (object, опционально) – данные правил оценки.

Пример тела запроса (одновременно отправляем оба файла):

{
  "telegram_id": 123456789,
  "questionnaire": {
    "title": "Пример опросника",
    "version": "1.0",
    "language": "ru",
    "questions": [
      {
        "id": "q1",
        "text": "Пример вопроса?",
        "type": "single-choice",
        "options": ["Да", "Нет"]
      }
      // ... другие вопросы
    ]
  },
  "scoring": {
    "scales": [
      {
        "id": "scale1",
        "questions": ["q1", "q2"],
        "aggregation": "sum"
      }
      // ... другие шкалы
    ],
    "overall": {
      "strategy": "max",
      "thresholds": [1, 2, 3]
    }
  }
}


Важно: хотя в примере показано поле telegram_id в теле, можно передать этот ID и в заголовке запроса.

Ответы сервиса

201 Created – опросник успешно добавлен или обновлён (в том числе перезапись старой версии). В теле ответа можно вернуть сообщение или метаданные (по реализации).

400 Bad Request – ошибка валидации. Например:

Некорректный JSON или неверный Content-Type.

Отсутствуют обязательные поля (title, version и т.д.) в questionnaire или поля scales/overall в scoring.

Неправильные типы данных или структура не соответствует ожидаемой (например, questions не массив).

401 Unauthorized – не указан Telegram ID или указан в неверном формате (нечисловой).

403 Forbidden – указанный Telegram ID не имеет прав администратора.

(Примечание: при перезаливке с совпадающим title и version сервер не вернёт ошибку дубликата – существующая запись будет перезаписана.)*

Пример использования: скрипт upload-questionnaire.sh

Ниже приведён пример простого bash-скрипта для загрузки опросника на сервер:

#!/bin/bash

API_URL=${API_URL:-http://localhost:8088}  # Адрес сервера, по умолчанию локально
TELEGRAM_ID=123456789                      # Телеграм ID администратора

echo "Uploading questionnaire to $API_URL..."
curl -X POST "$API_URL/questionnaires" \
  -H "Content-Type: application/json" \
  -H "X-Telegram-ID: $TELEGRAM_ID" \
  -d '{
    "questionnaire": '"$(cat questionnaire-demo.json)"',
    "scoring": '"$(cat scoring-demo.json)"'
  }' | jq .

echo "Done!"


Скрипт читает JSON-файлы questionnaire-demo.json и scoring-demo.json и отправляет их на сервер в одном запросе. Для работы скрипта требуется утилита jq для форматирования ответа.
